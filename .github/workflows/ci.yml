name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        deps: [highest]
        include:
          # The oldest versions composer.json allows, so a too-loose
          # constraint fails here instead of in someone's app.
          - php: "8.2"
            deps: lowest
    name: test (PHP ${{ matrix.php }}, ${{ matrix.deps }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --no-interaction --no-progress ${{ matrix.deps == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      # PHPUnit includes the check that src/Generated/Types.php matches the spec.
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  release-check:
    # Packagist publishes from the tag itself; this only fails loudly if the
    # tag and Inboundr::VERSION disagree.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Inboundr::VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -nE "s/.*const VERSION = '([^']+)'.*/\1/p" src/Inboundr.php)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match Inboundr::VERSION $version"
            exit 1
          fi
